name: Test formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check Homebrew style
        run: |
          brew developer on
          brew style Formula/dieter.rb
      - name: Install and test the formula
        run: |
          set -euo pipefail
          brew tap-new dieter/ci
          cp Formula/dieter.rb "$(brew --repo dieter/ci)/Formula/dieter.rb"
          brew install dieter/ci/dieter
          brew test dieter/ci/dieter
